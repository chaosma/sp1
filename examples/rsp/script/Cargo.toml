[package]
version = "0.1.0"
name = "rsp-script"
edition = "2021"

[dependencies]
alloy-primitives = "0.8.5"
bincode = "1.3.3"
anyhow = "1.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
tokio = { version = "1.43", default-features = false, features = ["full"] }
srt = { workspace = true }
mmap_buffer_rs = { path = "../../../third-party/mmap_buffer/mmap_buffer_rs", optional = true }
memmap2 = { version = "0.9", optional = true }
tracing = { workspace = true }
tonic = "0.12"

# rsp
rsp-client-executor = { git = "https://github.com/succinctlabs/rsp/", rev = "1ddb68b4bcf7060af7eb4930e79a17f927c99c93" }

# sp1
sp1-sdk = { path = "../../../crates/sdk" }
sp1-prover = { path = "../../../crates/prover" }
sp1-stark = { path = "../../../crates/stark" }
sp1-primitives = { path = "../../../crates/primitives" }

[build-dependencies]
sp1-build = { path = "../../../crates/build" }

[features]
default = []
cuda = ["sp1-sdk/cuda"]
mmap = ["srt/mmap", "dep:mmap_buffer_rs", "dep:memmap2"]

[[bin]]
name = "recursion_cpu_prover"
path = "bin/recursion_cpu_prover.rs"

[[bin]]
name = "verifier"
path = "bin/verifier.rs"

[[bin]]
name = "vk_generator"
path = "bin/vk_generator.rs"
