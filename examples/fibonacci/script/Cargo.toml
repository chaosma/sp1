[package]
name = "fibonacci-script"
version = { workspace = true }
edition = { workspace = true }
default-run = "fibonacci-script"
publish = false

[dependencies]
hex = "0.4.3"
sp1-sdk = { workspace = true, features = ["native-gnark"] }
sp1-prover = { workspace = true }
clap = { version = "4.5.7", features = ["derive", "env"] }
bincode = "1.3.3"
anyhow = "1.0.0"

[build-dependencies]
sp1-build = { workspace = true }

[[bin]]
name = "plonk_bn254"
path = "bin/plonk_bn254.rs"

[[bin]]
name = "groth16_bn254"
path = "bin/groth16_bn254.rs"

[[bin]]
name = "compressed"
path = "bin/compressed.rs"

[[bin]]
name = "execute"
path = "bin/execute.rs"

[[bin]]
name = "fibonacci-script"
path = "src/main.rs"

[features]
cuda = ["sp1-sdk/cuda"]
