[package]
name = "srt"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
tokio = { version = "1.43", default-features = false, features = ["full"] }
tokio-retry = "0.3"
anyhow = "1.0.95"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0"
rmp-serde = "1.3.0"
